services:
  postgres:
    image: postgres:16-alpine
    container_name: crypto-ls-postgres
    environment:
      POSTGRES_USER: crypto
      POSTGRES_PASSWORD: crypto
      POSTGRES_DB: cryptols
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crypto -d cryptols"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: crypto-ls-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

  data-updater:
    build:
      context: .
      dockerfile: Dockerfile.updater
    container_name: crypto-ls-data-updater
    environment:
      DATABASE_URL: postgresql://crypto:crypto@postgres:5432/cryptols
      UPDATER_INTERVAL_SEC: "300"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
